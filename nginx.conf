# =============================================================================
# MuduoChatServer — Nginx TCP Stream 四层反向代理
#
# 用法:
#   sudo nginx -c /mnt/d/C++perject/MuduoChatServer/nginx.conf
#   或追加到系统配置:
#   sudo cp nginx.conf /etc/nginx/stream.conf
#   在 /etc/nginx/nginx.conf 的 http 块之前加: include /etc/nginx/stream.conf;
# =============================================================================

# 加载动态模块（stream 模块在此）
include /etc/nginx/modules-enabled/*.conf;

worker_processes auto;
error_log /var/log/nginx/stream_error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

stream {
    # ========== 日志（可选，调试时开启） ==========
    log_format tcp '$remote_addr [$time_local] '
                   '$protocol $status $bytes_sent $bytes_received '
                   '$session_time "$upstream_addr"';
    access_log /var/log/nginx/stream_access.log tcp buffer=32k;

    # ========== 上游服务器集群 ==========
    upstream chatserver_backend {
        # 负载均衡算法: least_conn — 新连接分给当前连接数最少的实例
        least_conn;

        # 后端实例列表
        server 127.0.0.1:6000 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:6001 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:6002 max_fails=3 fail_timeout=30s;

        # 故障转移说明:
        #   max_fails=3: 连续3次连接失败后标记为 down
        #   fail_timeout=30s: down 后30秒重新尝试
        #   所有实例都 down 时 Nginx 返回连接拒绝
    }

    # ========== 服务监听 ==========
    server {
        listen 8000;
        # 如需绑定特定IP: listen 192.168.1.100:8000;

        # 代理到后端集群
        proxy_pass chatserver_backend;

        # 连接超时
        proxy_connect_timeout 5s;
        proxy_timeout 600s;  # 长连接保持10分钟

        # 缓冲区（对 TCP 透明转发影响不大，但建议设）
        proxy_buffer_size 16k;

        # 限制单 IP 并发连接数（防恶意连接耗尽）
        # limit_conn_zone $binary_remote_addr zone=perip:10m;
        # limit_conn perip 50;
    }
}
